# Builds the briefing as a static site and publishes it to GitHub Pages.
#
# Every provider runs here, during `next build`, so the published site holds
# no credentials: private calendar URLs and API keys live in secrets on the
# github-pages environment and only ever reach the build job. What they
# produce is encrypted with BRIEFING_DATA_KEY before it is published, and the
# browser decrypts it after login with BRIEFING_PASSWORD or a passkey; see
# docs/login-setup.md. The build fails rather than publish without the key.
name: Build and deploy briefing

on:
  schedule:
    # Every two hours from 5am to 11pm Central during daylight saving time
    # (10:00 to 04:00 UTC); an hour earlier in winter. GitHub can start
    # scheduled runs late, sometimes by hours when it is busy.
    - cron: "0 0,2,4,10,12,14,16,18,20,22 * * *"
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by the Apple Reminders Shortcut; see docs/apple-setup.md.
  repository_dispatch:
    types: [reminders]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Write access only to replace the reminders snapshot and the history
      # files, each on its own data branch.
      contents: write
      pages: read
    # The credentials are stored as github-pages environment secrets, which a
    # job only receives when it names that environment.
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # The Shortcut's reminders arrive in the event file, which is read from
      # disk rather than passed in the environment so they never appear in
      # the public run log. They are encrypted and force-pushed as the only
      # commit on reminders-data, replacing the previous snapshot.
      - name: Save reminders sent by the Shortcut
        if: github.event_name == 'repository_dispatch'
        env:
          REMINDERS_KEY: ${{ secrets.REMINDERS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/save-reminders.ts "$GITHUB_EVENT_PATH" .data/reminders.enc
          cd .data
          git init -q -b reminders-data
          git add reminders.enc
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update reminders snapshot"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" reminders-data

      - name: Load the last saved reminders
        if: github.event_name != 'repository_dispatch'
        run: |
          mkdir -p .data
          if git fetch -q --depth 1 origin reminders-data; then
            git show FETCH_HEAD:reminders.enc > .data/reminders.enc
          else
            echo "No reminders have been saved yet."
          fi

      # Public data carried between builds: the BGG hot list by day (for
      # rank movement) and news summaries by story (so each story is only
      # summarised once). The history-data branch holds it as plain JSON.
      - name: Load history
        run: |
          mkdir -p .data/history .data/history-loaded
          if git fetch -q --depth 1 origin history-data; then
            git archive FETCH_HEAD | tar -x -C .data/history
            cp -r .data/history/. .data/history-loaded/
          else
            echo "No history yet."
          fi

      - name: Build static site
        run: npm run build
        env:
          # The project site is served from /<repo>, which configure-pages reports.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # For the "edit data/passkeys.json" link shown after adding a passkey.
          NEXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}
          BRIEFING_DATA_KEY: ${{ secrets.BRIEFING_DATA_KEY }}
          BRIEFING_PASSWORD: ${{ secrets.BRIEFING_PASSWORD }}
          WORK_CALENDAR_ICAL_URL: ${{ secrets.WORK_CALENDAR_ICAL_URL }}
          HOME_CALENDAR_ICAL_URL: ${{ secrets.HOME_CALENDAR_ICAL_URL }}
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          REMINDERS_KEY: ${{ secrets.REMINDERS_KEY }}
          ICLOUD_SHARED_ALBUM_URL: ${{ secrets.ICLOUD_SHARED_ALBUM_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          HOME_ADDRESS: ${{ secrets.HOME_ADDRESS }}
          # Non-secret settings, from repository variables. Unset ones fall
          # back to the defaults documented in .env.example.
          OPEN_METEO_LATITUDE: ${{ vars.OPEN_METEO_LATITUDE }}
          OPEN_METEO_LONGITUDE: ${{ vars.OPEN_METEO_LONGITUDE }}
          OPEN_METEO_LOCATION: ${{ vars.OPEN_METEO_LOCATION }}
          OPEN_METEO_TIMEZONE: ${{ vars.OPEN_METEO_TIMEZONE }}
          OPEN_METEO_TEMPERATURE_UNIT: ${{ vars.OPEN_METEO_TEMPERATURE_UNIT }}
          TMDB_REGION: ${{ vars.TMDB_REGION }}
          COMICVINE_PUBLISHERS: ${{ vars.COMICVINE_PUBLISHERS }}
          IGNORED_EVENT_TITLES: ${{ vars.IGNORED_EVENT_TITLES }}
          HEADS_UP_IGNORE_TITLES: ${{ vars.HEADS_UP_IGNORE_TITLES }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          TRAVEL_BUFFER_MINUTES: ${{ vars.TRAVEL_BUFFER_MINUTES }}

      # Push the history back only when the build changed it.
      - name: Save history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if diff -rq .data/history .data/history-loaded > /dev/null; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/history"
          cp -r .data/history/. "$RUNNER_TEMP/history/"
          cd "$RUNNER_TEMP/history"
          git init -q -b history-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update history"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" history-data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer run supersedes a queued one. This sits
    # on the deploy job alone so a queued build can never displace a run that
    # still has a Shortcut's reminders to save.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
